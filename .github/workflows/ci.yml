name: CI Pipeline - Microservices

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Services
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - core
          - user-service
          - itinerary-service
          - chat-service
          - social-service
          - travel-alerts-service
          - destinations-service
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install core package
        if: matrix.service != 'core'
        run: |
          pip install -e .[all]

      - name: Install linting tools
        run: |
          pip install ruff

      - name: Lint ${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "core" ]; then
            echo "Linting core package..."
            ruff check core/
          else
            echo "Linting ${{ matrix.service }}..."
            ruff check services/${{ matrix.service }}/
          fi

      - name: Check formatting ${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "core" ]; then
            ruff format --check core/
          else
            ruff format --check services/${{ matrix.service }}/
          fi

  test:
    name: Test Services
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        service:
          - user-service
          - itinerary-service
          - chat-service
          - social-service
          - travel-alerts-service
          - destinations-service
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install core package
        run: |
          pip install -e .[all]

      - name: Install ${{ matrix.service }} dependencies
        run: |
          cd services/${{ matrix.service }}
          if [ -f "pyproject.toml" ]; then
            pip install -e .[all] || pip install -e .
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          cd -

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov httpx email-validator python-multipart aiosqlite pycountry

      - name: Run tests for ${{ matrix.service }}
        run: |
          pytest services/${{ matrix.service }}/ \
            --cov=services/${{ matrix.service }}/app \
            --cov-branch \
            --cov-report=xml:coverage-${{ matrix.service }}.xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-service
          - itinerary-service
          - chat-service
          - social-service
          - travel-alerts-service
          - destinations-service
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          tags: itinerario/${{ matrix.service }}:ci-validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load Docker image
        run: docker load < /tmp/image.tar

      - name: Test Docker image
        run: |
          docker run --rm itinerario/${{ matrix.service }}:ci-validation python -c "import sys; print(f'Python {sys.version}')"

  config-validation:
    name: Validate Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker compose config > /dev/null
          echo "Docker Compose configuration is valid"

      - name: Check Python syntax in all files
        run: |
          python -m py_compile $(find . -name "*.py" | grep -v "__pycache__")
          echo "All Python files have valid syntax"

      - name: Validate pyproject.toml
        run: |
          pip install tomli tomli_w
          python -c "import tomli; tomli.load(open('pyproject.toml', 'rb'))"
          echo "pyproject.toml is valid"

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install safety bandit[toml]

      - name: Run Safety check
        run: |
          safety check --json || echo "Some dependencies have known vulnerabilities"
        continue-on-error: true

      - name: Run Bandit security linter
        run: |
          bandit -r core/ services/ -f json -o bandit-report.json || echo "Bandit found potential security issues"
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, docker, config-validation, security]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Config Validation | ${{ needs.config-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Checks | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
