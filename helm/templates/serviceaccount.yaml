{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "itinerario.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "itinerario.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.name | printf "%s@YOUR_PROJECT_ID.iam.gserviceaccount.com" | quote }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
