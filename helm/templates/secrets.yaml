{{- if .Values.secrets.manageSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "itinerario.labels" . | nindent 4 }}
    app: itinerario-secrets
type: Opaque
data:
  username: {{ .Values.secrets.dbUsername | b64enc | quote }}
  password: {{ .Values.secrets.dbPassword | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "itinerario.labels" . | nindent 4 }}
    app: itinerario-secrets
type: Opaque
data:
  secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: firebase-config
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "itinerario.labels" . | nindent 4 }}
    app: itinerario-secrets
type: Opaque
data:
  firebase-config.json: {{ .Values.secrets.firebaseConfig | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: itinerario-secrets
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "itinerario.labels" . | nindent 4 }}
    app: itinerario-secrets
type: Opaque
stringData:
  FIREBASE_PROJECT_ID: {{ .Values.secrets.firebaseProjectId | quote }}
  CLOUD_STORAGE_BUCKET: {{ .Values.secrets.cloudStorageBucket | quote }}
  DB_HOST: {{ .Values.secrets.dbHost | quote }}
  DB_NAME: {{ .Values.secrets.dbName | quote }}
  DB_PORT: {{ .Values.secrets.dbPort | quote }}
  CLOUD_SQL_CONNECTION_NAME: {{ .Values.secrets.cloudSqlConnectionName | quote }}
  AVIATIONSTACK_API_KEY: {{ .Values.secrets.aviationstackApiKey | quote }}
  FLIGHT_SYNC_MODE: {{ .Values.secrets.flightSyncMode | quote }}
  CENTRIFUGO_API_KEY: {{ .Values.secrets.centrifugoApiKey | quote }}
  CENTRIFUGO_HMAC_SECRET_KEY: {{ .Values.secrets.centrifugoHmacSecretKey | quote }}
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: centrifugo-config
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "itinerario.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "token_hmac_secret_key": "{{ .Values.secrets.centrifugoHmacSecretKey }}",
      "api_key": "{{ .Values.secrets.centrifugoApiKey }}",
      "admin_password": "{{ .Values.secrets.centrifugoAdminPassword | default "admin123" }}",
      "admin_secret": "{{ .Values.secrets.centrifugoAdminSecret | default "admin-secret" }}",
      "namespaces": [
        {
          "name": "chat",
          "history_size": 100,
          "history_ttl": 300,
          "force_recovery": true
        }
      ],
      "client_insecure": false,
      "allowed_origins": [
        "https://www.your-domain.com",
        "https://your-domain.com",
        "http://localhost:5173",
        "http://localhost:3000"
      ],
      "health": true
    }
