[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itinerario-travel-alerts-service"
version = "0.1.0"
description = "Travel alerts microservice for Itinerario platform"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Itinerario Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "core[firestore]>=0.1.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "pycountry>=23.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
travel-alerts-service = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]
