[pytest]
testpaths = tests
python_files = test_*.py unit.py integration.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings
asyncio_mode = auto
markers =
    asyncio: mark test as async
    unit: mark test as unit test
    integration: mark test as integration test
    slow: mark test as slow running
filterwarnings =
    ignore::DeprecationWarning
